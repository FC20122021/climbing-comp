<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抽奖转盘</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #ffffff; min-height: 100vh; color: #1a418f; margin-left: 240px;
            padding: 40px 20px;
        }
        .container { max-width: 720px; margin: 0 auto; }
        h1 { text-align: center; font-size: 32px; color: #1a418f; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #1a418f; opacity: 0.65; font-size: 15px; margin-bottom: 40px; }

        /* 老虎机显示窗 */
        .slot-machine {
            background: linear-gradient(135deg, #1a418f 0%, #0d2b63 100%);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(26,65,143,0.35), inset 0 0 0 4px #0dac67;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }
        .slot-machine::before,
        .slot-machine::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 50px;
            z-index: 5;
            pointer-events: none;
        }
        .slot-machine::before {
            top: 0;
            background: linear-gradient(to bottom, rgba(26,65,143,0.95), rgba(26,65,143,0));
        }
        .slot-machine::after {
            bottom: 0;
            background: linear-gradient(to top, rgba(26,65,143,0.95), rgba(26,65,143,0));
        }

        .slot-window {
            position: relative;
            height: 260px;
            overflow: hidden;
            border-radius: 16px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 4px 20px rgba(0,0,0,0.15);
        }

        .slot-number {
            font-size: 140px;
            font-weight: 900;
            color: #1a418f;
            letter-spacing: 4px;
            line-height: 1;
            transition: none;
            font-family: 'Courier New', monospace;
            text-shadow: 0 4px 0 rgba(26,65,143,0.1);
        }
        .slot-number.rolling {
            color: #0dac67;
        }

        /* 中奖后的闪光效果 */
        .slot-machine.winner {
            animation: winnerPulse 0.6s ease-out;
        }
        @keyframes winnerPulse {
            0% { box-shadow: 0 20px 60px rgba(26,65,143,0.35), inset 0 0 0 4px #0dac67; }
            50% { box-shadow: 0 20px 80px rgba(241,196,15,0.6), inset 0 0 0 4px #f1c40f; }
            100% { box-shadow: 0 20px 60px rgba(26,65,143,0.35), inset 0 0 0 4px #0dac67; }
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .btn-spin {
            background: #0dac67;
            color: white;
            border: none;
            padding: 20px 60px;
            border-radius: 16px;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            box-shadow: 0 8px 20px rgba(13,172,103,0.35);
            letter-spacing: 2px;
        }
        .btn-spin:hover { background: #0a8a53; }
        .btn-spin:active { transform: scale(0.96); }
        .btn-spin:disabled { background: #b0bec5; cursor: not-allowed; box-shadow: none; }

        .btn-reset {
            background: #ffffff;
            color: #1a418f;
            border: 2px solid #1a418f;
            padding: 18px 36px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-reset:hover { background: #f0f4f8; }

        /* 结果展示 */
        .result-box {
            text-align: center;
            padding: 36px 24px;
            background: linear-gradient(135deg, #ece0f8 0%, #d3b8ea 100%);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(155,110,200,0.2);
            min-height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .result-box .placeholder {
            font-size: 20px;
            color: #7b3fa0;
            opacity: 0.6;
        }
        .result-box .label {
            font-size: 18px;
            color: #7b3fa0;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .result-box .winner-name {
            font-size: 44px;
            font-weight: 900;
            color: #1a418f;
            letter-spacing: 2px;
            line-height: 1.2;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #1a418f;
            opacity: 0.6;
            font-size: 18px;
        }

        @media (max-width: 768px) {
            body { margin-left: 0; padding-top: 80px; padding-left: 16px; padding-right: 16px; }
            h1 { font-size: 26px; }
            .slot-window { height: 200px; }
            .slot-number { font-size: 100px; }
            .btn-spin { padding: 18px 44px; font-size: 20px; }
            .btn-reset { padding: 16px 28px; font-size: 16px; }
            .result-box .winner-name { font-size: 34px; }
        }
    </style>
</head>
<body>
    {% include '_nav.html' %}
    <div class="container">
        <h1>🎁 抽奖</h1>
        <p class="subtitle">共 {{ athletes|length }} 位选手参与 · 点击开始滚动号码</p>

        {% if athletes %}
        <div class="slot-machine" id="slotMachine">
            <div class="slot-window">
                <div class="slot-number" id="slotNumber">?</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn-spin" id="spinBtn" onclick="spin()">开 始 抽 奖</button>
            <button class="btn-reset" onclick="resetResult()">重置</button>
        </div>

        <div class="result-box" id="resultBox">
            <div class="placeholder" id="resultPlaceholder">点击「开始抽奖」</div>
            <div id="resultContent" style="display:none;">
                <div class="label">🎉 恭喜抽中</div>
                <div class="winner-name" id="winnerName"></div>
            </div>
        </div>
        {% else %}
        <div class="empty-state">
            暂无有编号的选手，请先完成报名并分配编号。
        </div>
        {% endif %}
    </div>

    <script>
        // 从后端传过来的选手数据
        const athletes = [
            {% for a in athletes %}
            { number: {{ a.number }}, name: "{{ a.name }}" }{% if not loop.last %},{% endif %}
            {% endfor %}
        ];

        let isSpinning = false;
        let rollTimer = null;

        function spin() {
            if (isSpinning || athletes.length === 0) return;
            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('resultPlaceholder').style.display = 'none';
            document.getElementById('resultContent').style.display = 'none';
            document.getElementById('slotMachine').classList.remove('winner');

            const slotEl = document.getElementById('slotNumber');
            slotEl.classList.add('rolling');

            // 随机选一个中奖者
            const winnerIndex = Math.floor(Math.random() * athletes.length);
            const winner = athletes[winnerIndex];

            // 总时长约 4 秒，先快后慢
            const totalDuration = 4000;
            const startTime = performance.now();

            // 滚动间隔从 40ms 逐渐增加到 500ms
            function getInterval(progress) {
                // progress 0 -> 1
                // 40ms -> 500ms
                return 40 + progress * 460;
            }

            let lastUpdate = startTime;

            function roll(now) {
                const elapsed = now - startTime;
                const progress = Math.min(1, elapsed / totalDuration);

                // 到了更新时间就换一个随机编号
                if (now - lastUpdate >= getInterval(progress)) {
                    lastUpdate = now;
                    // 滚动期间显示随机编号
                    const randomAthlete = athletes[Math.floor(Math.random() * athletes.length)];
                    slotEl.textContent = randomAthlete.number;
                }

                if (progress < 1) {
                    requestAnimationFrame(roll);
                } else {
                    // 最终停在 winnder
                    slotEl.textContent = winner.number;
                    slotEl.classList.remove('rolling');

                    // 闪光效果
                    document.getElementById('slotMachine').classList.add('winner');

                    // 显示中奖者姓名
                    setTimeout(() => {
                        document.getElementById('winnerName').textContent = winner.name;
                        document.getElementById('resultContent').style.display = 'block';

                        isSpinning = false;
                        document.getElementById('spinBtn').disabled = false;
                    }, 400);
                }
            }

            requestAnimationFrame(roll);
        }

        function resetResult() {
            if (isSpinning) return;
            document.getElementById('slotNumber').textContent = '?';
            document.getElementById('resultPlaceholder').style.display = 'block';
            document.getElementById('resultContent').style.display = 'none';
            document.getElementById('slotMachine').classList.remove('winner');
        }
    </script>
</body>
</html>
