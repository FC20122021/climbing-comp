<aside class="sidebar-desktop">

    <div class="logo-area">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Allez Climbing Gym" class="logo-img-desktop">
    </div>

    <!-- 菜单项 -->
    <nav class="sidebar-nav">

<!-- ============================================ -->
<!-- 手机端：顶部横向导航栏                        -->
<!-- ============================================ -->
<nav class="navbar-mobile">
    <!-- 手机端 Logo -->
    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Allez Climbing Gym" class="logo-img-mobile">

    <!-- 手机端菜单项（横向滚动） -->
    <div class="mobile-menu">
        <a href="/admin/control" class="nav-link-mobile">控制台</a>
        <a href="/admin/signups" class="nav-link-mobile">报名</a>
        <a href="/admin/routes" class="nav-link-mobile">线路</a>
        <a href="/admin/import" class="nav-link-mobile">导入</a>
        <a href="/leaderboard" class="nav-link-mobile">大屏</a>
        <a href="/admin/lottery" class="nav-link">抽奖转盘</a>
    </div>

    <!-- 手机端退出按钮 -->
    <a href="/judge/logout" class="btn-logout-mobile">退出</a>
</nav>

<style>
    /* ============================================ */
    /* 通用样式                                      */
    /* ============================================ */
    .sidebar-desktop,
    .navbar-mobile {
        background: #f3dfae;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Logo 图片 */
    .logo-img-desktop {
        width: 160px;
        height: auto;
        display: block;
        margin: 0 auto;
    }
    .logo-img-mobile {
        width: 48px;
        height: 48px;
        object-fit: contain;
        flex-shrink: 0;
    }

    /* ============================================ */
    /* 电脑端侧边栏样式                              */
    /* ============================================ */
    .sidebar-desktop {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 240px;
        padding: 20px 0;
        display: flex;
        flex-direction: column;
        z-index: 100;
        box-shadow: 2px 0 8px rgba(0, 0, 0, 0.04);
    }
    .logo-area {
        padding: 20px;
        text-align: center;
        border-bottom: 1px solid rgba(26, 65, 143, 0.15);
        margin-bottom: 10px;
    }
    .sidebar-nav {
        display: flex;
        flex-direction: column;
        padding: 0 12px;
        gap: 4px;
    }
    .sidebar-desktop .nav-link {
        color: #1a418f;
        text-decoration: none;
        font-size: 19px;
        font-weight: 600;
        padding: 14px 16px;
        border-radius: 8px;
        transition: background 0.2s, color 0.2s;
    }
    .sidebar-desktop .nav-link:hover {
        background: rgba(255, 255, 255, 0.65);
        color: #0dac67;
    }
    .logout-area {
        margin-top: auto;
        padding: 20px 12px;
    }
    .btn-logout {
        display: block;
        text-align: center;
        color: #ffffff;
        text-decoration: none;
        font-size: 19px;
        font-weight: 700;
        padding: 14px 20px;
        border-radius: 8px;
        background: #0dac67;
        transition: background 0.2s;
    }
    .btn-logout:hover {
        background: #0a8a53;
    }

    /* ============================================ */
    /* 手机端顶部导航样式                            */
    /* ============================================ */
    .navbar-mobile {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 64px;
        padding: 0 12px;
        align-items: center;
        gap: 8px;
        z-index: 100;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }
    .mobile-menu {
        display: flex;
        align-items: center;
        gap: 4px;
        overflow-x: auto;
        flex: 1;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
    }
    .mobile-menu::-webkit-scrollbar {
        display: none;
    }
    .navbar-mobile .nav-link-mobile {
        color: #1a418f;
        text-decoration: none;
        font-size: 17px;
        font-weight: 600;
        padding: 8px 12px;
        border-radius: 8px;
        white-space: nowrap;
        transition: background 0.2s, color 0.2s;
        flex-shrink: 0;
    }
    .navbar-mobile .nav-link-mobile:hover {
        background: rgba(255, 255, 255, 0.65);
        color: #0dac67;
    }
    .btn-logout-mobile {
        color: #ffffff;
        text-decoration: none;
        font-size: 17px;
        font-weight: 700;
        padding: 9px 16px;
        border-radius: 8px;
        background: #0dac67;
        flex-shrink: 0;
        transition: background 0.2s;
    }
    .btn-logout-mobile:hover {
        background: #0a8a53;
    }

    /* ============================================ */
    /* 响应式切换                                    */
    /* ============================================ */
    @media (min-width: 769px) {
        .sidebar-desktop { display: flex; }
        .navbar-mobile { display: none; }
    }
    @media (max-width: 768px) {
        .sidebar-desktop { display: none; }
        .navbar-mobile { display: flex; }
    }
</style>
