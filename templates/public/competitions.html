<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>历史比赛</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #ffffff; min-height: 100vh; color: #1a418f; margin-left: 240px;
        }
        .page-wrapper { max-width: 900px; margin: 0 auto; padding: 60px 24px; }
        h1 { text-align: center; color: #1a418f; margin-bottom: 30px; font-size: 32px; }
        .empty-state {
            text-align: center; background: #e8f7ef; border: 2px solid #0dac67;
            border-radius: 16px; padding: 60px 20px; color: #1a418f; font-size: 16px;
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
        @media (max-width: 768px) {
            body { margin-left: 0; padding-top: 64px; }
            h1 { font-size: 26px; }
            .page-wrapper { padding: 40px 18px; }
        }

</head>
<body>
    {% include '_public_nav.html' %}
    <div class="page-wrapper">
        <h1>🏆 历史比赛</h1>

            <p>暂无历史比赛记录</p>
            <p style="margin-top:8px; font-size:14px; opacity:0.7;">敬请期待第一届比赛的精彩回顾</p>
        </div>
