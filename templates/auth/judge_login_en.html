<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #ffffff; min-height: 100vh;
            display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .login-box {
            width: 100%; max-width: 400px; background: #fff;
            border: 2px solid #0dac67; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(13,172,103,0.12); padding: 36px 28px;
        }
        .login-box h2 { text-align: center; margin-bottom: 8px; color: #1a418f; font-size: 26px; }
        .login-box .subtitle { text-align: center; color: #1a418f; opacity: 0.7; font-size: 15px; margin-bottom: 24px; }
        .error {
            background: #ffebee; color: #c62828; border: 1px solid #ef9a9a;
            padding: 12px 16px; border-radius: 10px; text-align: center;
            margin-bottom: 16px; font-size: 15px;
        }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; color: #1a418f; font-weight: 600; font-size: 15px; }
        input {
            width: 100%; padding: 14px 16px; border: 1.5px solid #c8e6d6;
            border-radius: 10px; font-size: 17px; background: #ffffff;
            color: #1a418f; transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus { outline: none; border-color: #0dac67; box-shadow: 0 0 0 3px rgba(13,172,103,0.15); }
        button {
            width: 100%; padding: 16px; background: #0dac67; color: white;
            border: none; border-radius: 12px; font-size: 18px; font-weight: 700;
            cursor: pointer; transition: background-color 0.2s; margin-top: 10px;
        }
        button:hover { background: #0a8a53; }
        .back-link {
            display: block; text-align: center; margin-top: 18px;
            color: #1a418f; opacity: 0.6; text-decoration: none; font-size: 15px;
        }
        .back-link:hover { color: #0dac67; opacity: 1; }
        .note {
            margin-top: 20px; padding-top: 16px; border-top: 1px solid #e8f7ef;
            font-size: 14px; color: #1a418f; opacity: 0.7; text-align: center; line-height: 1.7;
        }
        .lang-switch {
            position: absolute; top: 20px; right: 20px;
        }
        .lang-switch a {
            display: inline-block; padding: 6px 14px; border-radius: 8px;
            text-decoration: none; font-size: 14px; font-weight: 600;
            background: #e8f7ef; color: #0dac67; margin-left: 6px;
        }
    </style>
</head>
<body>
    <div class="lang-switch">
        <a href="/set_language/zh">中文</a>
        <a href="/set_language/en" style="background:#0dac67; color:white;">EN</a>
    </div>
    <div class="login-box">
        <h2>🔐 Log In</h2>
        <p class="subtitle">Judges and admins use their own accounts</p>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form action="{{ url_for('judge_login_post') }}" method="POST">
            <div class="form-group"><label for="username">Username</label><input type="text" id="username" name="username" placeholder="Enter username" required></div>
            <div class="form-group"><label for="password">Password</label><input type="password" id="password" name="password" placeholder="Enter password" required></div>
            <button type="submit">Log In</button>
        </form>
        <div class="note">Judges can score after logging in;<br>Admins can access the management panel.</div>
        <a class="back-link" href="/">← Back to Home</a>
    </div>
</body>
</html>
